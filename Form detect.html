<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><title>IALB Seats</title></head>
<body>
<!-- Netlify form detection file — do not delete -->
<form name="request" method="POST" data-netlify="true" netlify-honeypot="bot-field" style="display:none">
  <input type="hidden" name="form-name" value="request" />
  <input type="hidden" name="subject"   value="New Enquiry — IALB Seats" />
  <input name="bot-field" />
  <input type="text"     name="name" />
  <input type="email"    name="email" />
  <input type="tel"      name="phone" />
  <input type="text"     name="event" />
  <input type="text"     name="details" />
  <select name="quantity"><option value="1">1</option></select>
  <input type="text"     name="budget" />
  <textarea name="notes"></textarea>
  <input type="checkbox" name="consent" value="yes" />
  <button type="submit">Submit</button>
</form>
</body>
</html>
